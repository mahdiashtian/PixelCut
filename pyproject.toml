[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "admin-movie-editor"
version = "0.1.0"
description = "Private Telethon video editor with a single-pass FFmpeg pipeline"
requires-python = ">=3.11"
dependencies = [
    "Telethon>=1.45,<2",
    "Pillow>=11,<13",
    "arabic-reshaper>=3,<4",
    "python-bidi>=0.6,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
movie-editor = "movie_editor.app:main"

[tool.setuptools.packages.find]
include = ["movie_editor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: renders real media with FFmpeg and FFprobe"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

